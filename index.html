<head>
<meta charset="utf-8">

<title>JEE Main 2025 Syllabus Checklist</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5bea">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--mute:#5d6b86;--line:#dde3ef;--acc:#2f5bea;--accsoft:#e6ecfe;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--ink:#e8edf9;--mute:#93a0bd;--line:#2a3452;--accsoft:#1f2a4d}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--ink:#e8edf9;--mute:#93a0bd;--line:#2a3452;--accsoft:#1f2a4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px}
header h1{font-size:1.5rem;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
header p{margin:0;color:var(--mute);font-size:.9rem}
.overall{display:flex;align-items:center;gap:10px;margin:12px 0 14px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .25s}
.overall b{font-size:.9rem;min-width:110px;text-align:right}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.tab{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 2px;cursor:pointer;text-align:center;min-width:0}
.tab strong{display:block;font-size:.88rem}
.tab span{font-size:.75rem;color:var(--mute)}
.tab[aria-selected="true"]{border-color:var(--acc);background:var(--accsoft)}
.tab[aria-selected="true"] span{color:var(--ink)}
.tab:focus-visible,.chead:focus-visible,.row:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.note{background:var(--accsoft);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:6px 0 2px}
.group{margin:18px 2px 6px;font-weight:600;font-size:.95rem;color:var(--acc)}
.chap{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.chap.done{border-color:var(--acc)}
.top{display:flex;align-items:center}
.chead{flex:1;display:flex;align-items:center;gap:10px;font:inherit;color:inherit;background:none;border:0;padding:12px 6px 12px 12px;text-align:left;cursor:pointer;min-width:0}
.chev{width:10px;height:10px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-right:2px}
.open .chev{transform:rotate(45deg)}
.cname{flex:1;font-weight:600;font-size:.97rem;min-width:0}
.cnt{font-size:.8rem;color:var(--mute);white-space:nowrap}
.all{padding:0 12px 0 4px;display:flex;align-items:center;height:44px;cursor:pointer}
.cb{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--mute);border-radius:6px;margin:0;display:grid;place-content:center;cursor:pointer;background:transparent;flex:none}
.cb:checked{background:var(--acc);border-color:var(--acc)}
.cb:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:indeterminate{border-color:var(--acc)}
.cb:indeterminate::after{content:"";width:10px;height:2.5px;background:var(--acc)}
.cb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mini{height:3px;background:var(--line)}
.mini i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.topics{display:none;border-top:1px solid var(--line);padding:4px 0}
.open .topics{display:block}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;cursor:pointer;font-size:.93rem}
.row span{flex:1}
.row.on span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.foot{margin-top:22px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;color:var(--mute);font-size:.8rem}
.foot button{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.add{display:flex;gap:8px;padding:8px 14px 12px}
.add input{flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px}
.add input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.add button{font:inherit;font-size:.88rem;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:8px;padding:0 14px;cursor:pointer;white-space:nowrap}
#addch{padding:0;margin-top:14px}
.del{font:inherit;background:none;border:0;color:var(--mute);cursor:pointer;padding:0 4px;font-size:.9rem;line-height:1}
.delch{margin:0 14px 12px;font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:5px 10px;cursor:pointer}
.empty{padding:10px 14px;font-size:.88rem;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KEY="jee-main-2025-checklist-v2",CKEY="jee-main-2025-custom-v1";
let done=new Set(),cur="m",openCh=new Set(),cust={chapters:{},topics:{},n:0};
try{const s=localStorage.getItem(KEY);if(s)done=new Set(JSON.parse(s))}catch(e){}
try{const s=localStorage.getItem(CKEY);if(s)cust=Object.assign(cust,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]));localStorage.setItem(CKEY,JSON.stringify(cust))}catch(e){}};
const uid=()=>++cust.n;
const pct=(a,b)=>b?Math.round(a/b*100):0;
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function chaps(s){
  const a=D[s].ch.map((c,i)=>({ref:String(i),name:c[0],group:c[2],topics:c[1].split("|").map((t,j)=>({k:s+":"+i+":"+j,t,c:0}))}));
  (cust.chapters[s]||[]).forEach(u=>a.push({ref:"u"+u.id,name:u.name,custom:1,topics:[]}));
  a.forEach(ch=>(cust.topics[s+":"+ch.ref]||[]).forEach(t=>ch.topics.push({k:s+":"+ch.ref+":c"+t.id,t:t.t,c:t.id})));
  return a;
}
const count=ch=>{let d=0;ch.topics.forEach(t=>{if(done.has(t.k))d++});return[d,ch.topics.length]};
const subj=s=>{let d=0,n=0;chaps(s).forEach(c=>{const x=count(c);d+=x[0];n+=x[1]});return[d,n]};

function render(){
  document.documentElement.style.setProperty("--acc",D[cur].acc);
  let td=0,tn=0;
  document.getElementById("tabs").innerHTML=Object.keys(D).map(s=>{const[d,n]=subj(s);if(s!=="x"){td+=d;tn+=n}
    return `<button class="tab" role="tab" aria-selected="${s===cur}" data-s="${s}"><strong>${D[s].name}</strong><span>${pct(d,n)}%</span></button>`}).join("");
  document.getElementById("obar").style.width=pct(td,tn)+"%";
  document.getElementById("otxt").textContent=td+" / "+tn+" syllabus topics";
  document.getElementById("note").innerHTML=D[cur].note?`<div class="note">${D[cur].note}</div>`:"";
  let h="",head=false;
  chaps(cur).forEach((c,i)=>{
    if(c.group)h+=`<div class="group">${c.group}</div>`;
    else if(c.custom&&!head){h+=`<div class="group">Added by you</div>`;head=true}
    const[d,n]=count(c),isOpen=openCh.has(cur+c.ref);
    h+=`<div class="chap${isOpen?" open":""}${n&&d===n?" done":""}">
      <div class="top"><button class="chead" aria-expanded="${isOpen}" data-toggle="${c.ref}"><i class="chev"></i><span class="cname">${esc(c.name)}</span><span class="cnt">${d}/${n}</span></button>
      <label class="all" title="Mark whole chapter"><input type="checkbox" class="cb" data-all="${i}" aria-label="Mark all topics in ${esc(c.name)}" ${n&&d===n?"checked":""} ${d>0&&d<n?'data-ind="1"':""}></label></div>
      <div class="mini"><i style="width:${pct(d,n)}%"></i></div>
      <div class="topics">${c.topics.map(t=>`<label class="row${done.has(t.k)?" on":""}"><input type="checkbox" class="cb" data-k="${t.k}" ${done.has(t.k)?"checked":""}><span>${esc(t.t)}</span>${t.c?`<button type="button" class="del" data-del="${t.k}" aria-label="Remove topic">✕</button>`:""}</label>`).join("")}
      ${c.custom&&!n?`<div class="empty">No topics yet. Add your first one below.</div>`:""}
      <form class="add" data-addt="${c.ref}"><input type="text" maxlength="120" placeholder="Add your own topic" aria-label="Add a topic to ${esc(c.name)}"><button type="submit">Add</button></form>
      ${c.custom?`<button type="button" class="delch" data-delch="${c.ref}">Remove this chapter</button>`:""}</div></div>`;
  });
  h+=`<form class="add" id="addch"><input type="text" maxlength="100" placeholder="Add your own chapter" aria-label="Add a chapter to ${D[cur].name}"><button type="submit">Add chapter</button></form>`;
  const L=document.getElementById("list");L.innerHTML=h;
  L.querySelectorAll("[data-ind]").forEach(e=>e.indeterminate=true);
}
const L=document.getElementById("list");
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(b){cur=b.dataset.s;render();window.scrollTo({top:0})}});
L.addEventListener("click",e=>{
  const t=e.target.closest("[data-toggle]");
  if(t){const k=cur+t.dataset.toggle;openCh.has(k)?openCh.delete(k):openCh.add(k);render();return}
  const d=e.target.closest("[data-del]");
  if(d){e.preventDefault();const k=d.dataset.del,p=k.split(":"),id=+p[2].slice(1),key=p[0]+":"+p[1];
    cust.topics[key]=(cust.topics[key]||[]).filter(x=>x.id!==id);done.delete(k);save();render();return}
  const c=e.target.closest("[data-delch]");
  if(c){const ref=c.dataset.delch;if(!confirm("Remove this chapter and its topics?"))return;
    cust.chapters[cur]=(cust.chapters[cur]||[]).filter(x=>"u"+x.id!==ref);delete cust.topics[cur+":"+ref];
    [...done].forEach(k=>{if(k.startsWith(cur+":"+ref+":"))done.delete(k)});save();render()}
});
L.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.k){el.checked?done.add(el.dataset.k):done.delete(el.dataset.k)}
  else if(el.dataset.all!==undefined){chaps(cur)[el.dataset.all].topics.forEach(t=>{el.checked?done.add(t.k):done.delete(t.k)})}
  else return;
  save();render();
});
L.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target,inp=f.querySelector("input"),v=inp.value.trim();
  if(!v){inp.focus();return}
  if(f.id==="addch"){
    const id=uid();(cust.chapters[cur]=cust.chapters[cur]||[]).push({id,name:v});openCh.add(cur+"u"+id);save();render();
    const nf=L.querySelector(`[data-addt="u${id}"] input`);if(nf)nf.focus();
  }else{
    const ref=f.dataset.addt,key=cur+":"+ref;
    (cust.topics[key]=cust.topics[key]||[]).push({id:uid(),t:v});openCh.add(cur+ref);save();render();
    const nf=L.querySelector(`[data-addt="${ref}"] input`);if(nf)nf.focus();
  }
});
document.getElementById("reset").addEventListener("click",()=>{
  if(!confirm("Clear all ticks for "+D[cur].name+"? Topics you added stay."))return;
  [...done].forEach(k=>{if(k[0]===cur)done.delete(k)});save();render();
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
